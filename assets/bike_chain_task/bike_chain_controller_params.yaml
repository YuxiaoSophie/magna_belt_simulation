osc_target_poses_post_mpc: []

# Tolerances for reaching targets in predefined motion and MPC.
predefined_motion_position_tolerance: 0.005 # m
predefined_motion_orientation_tolerance: 0.15 # rad
predefined_motion_linear_speed: 0.08 # m/s
predefined_motion_angular_speed: 0.5 # rad/s
ur_predefined_motion_linear_speed: 0.08 # m/s
ur_predefined_motion_angular_speed: 0.5 # rad/s
mpc_position_tolerance: 0.015
mpc_orientation_tolerance: 0.4 # rad (0.2 radians = 11.5 degrees)
mpc_warmup_iterations: 3000 # Number of C3 solve iterations before outputting trajectory (0 = no warm-up)
verbose: true # Enable verbose debug printing for pose tracking
target_poses_in_board_frame: false
user_confirm_to_run: false # default; a waypoint or segment can override it
user_confirm_radio_channel: 12 # gamepad confirm button (xbox_script.py: X)

# Offline-compiled bimanual trajectories (.lcmtraj from
# python/compile_bimanual_trajectory.py). Empty file names keep the
# waypoint-by-waypoint behaviour.
post_mpc_compiled_trajectory_file: ""
compiled_trajectory_publish_horizon: 0.3 # s of look-ahead in each published window
compiled_trajectory_publish_sample_period: 0.02 # s between published samples
compiled_trajectory_start_joint_tolerance: 0.05 # rad, max per-joint error at the start gate
compiled_trajectory_gate_timeout: 5.0 # s
compiled_trajectory_abort_position_error: 0.03 # m
compiled_trajectory_abort_orientation_error: 0.3 # rad
compiled_trajectory_abort_joint_error: 0.35 # rad
compiled_trajectory_settle_timeout: 3.0 # s after the trajectory ends
compiled_trajectory_calibration_position_tolerance: 1.0e-4 # m
compiled_trajectory_calibration_orientation_tolerance: 1.0e-3 # rad

assembly_c3_options_file: "systems/parameters/round_belt_assembly_c3_options.yaml"
lcm_channels_file: "systems/parameters/lcm_channels.yaml"
