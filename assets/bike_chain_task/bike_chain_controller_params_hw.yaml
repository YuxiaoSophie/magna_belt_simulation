franka_arm_hand_model: "package://drake_models/franka_description/urdf/panda_arm_hand_with_long_fingers.urdf"
ur_arm_hand_model: "package://drake-ur-driver/models/ur10.urdf"
task_board_model: "models/bike_chain_task/bike_chain_task_board.sdf"
ee_model: "models/common/end_effector_simple_model.urdf"
bike_chain_model: "models/bike_chain_task/bike_chain.urdf"
task_board_position: [0.67206688, -0.19727797, 0.01063954]
task_board_orientation: [0.0, 0.0, 1.57079]
target_lcs_positions: []

# Define target poses for OSC (before MPC)
osc_target_poses_pre_mpc: []

# Define target poses for OSC (after MPC)
osc_target_poses_post_mpc: []


# Tolerances for reaching targets in predefined motion and MPC.
predefined_motion_position_tolerance: 0.005 # m
predefined_motion_orientation_tolerance: 0.15 # rad
mpc_position_tolerance: 0.015
mpc_orientation_tolerance: 0.4 # rad (0.2 radians = 11.5 degrees)
mpc_warmup_iterations: 3000 # Number of C3 solve iterations before outputting trajectory (0 = no warm-up)
verbose: true # Enable verbose debug printing for pose tracking

assembly_c3_options_file: "systems/parameters/bike_chain_c3_options_generated.yaml"
lcm_channels_file: "systems/parameters/lcm_channels.yaml"
visualizer_params_file: "systems/parameters/bike_chain_visualization_params.yaml"
