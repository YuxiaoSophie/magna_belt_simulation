[project]
name = "magna-belt-simulation"
version = "0.1.0"
description = "Newton and Warp simulation for robotic belt manipulation"
requires-python = ">=3.10"

dependencies = [
    "lcm>=1.5.2",
    "loguru>=0.7.3",
    "newton[examples]",
    "pyyaml>=6.0.3",
    "trimesh>=4.12.2",
    "viser>=1.0.26",
]

[tool.uv]
package = false
prerelease = "allow"

[tool.uv.sources]
newton = { path = "external/newton", editable = true }

[tool.ruff]
# First-party roots: src/ for the task packages, lcmtypes/ for the generated dairlib/drake/robotiq
# packages (see src/task_common/__init__.py).
src = ["src", "lcmtypes"]
