# Model and closed-loop evaluation registry (machine-readable twin of docs/models.md).
# Kept in docs/ because data/ is gitignored. Numbers are copied from existing tables only;
# each result carries its source path. BL = the waypoint baseline controller.
schema_version: 1
updated: '2026-10-02'
doc: docs/models.md
scheme:
  model_id: V<campaign>[letter]; campaign = lcs_learning outputs/sim_belt_v<N>_<date>/ (V1 = sim_belt_ablation_20260924)
  tag: <data>-<objective>-<dynamics>
  eval_label: <ID> · <suite> · <cost> · <limits>
suites:
  seat6: flat_engaged x {nominal, gv_01, gv_05}, urtip x ud+3_r0, urtip6 x ud+6_r0, urtip6_high x ud+6_r0 (synthetic seated targets, 2 stages)
  yaw12: the seat6 starts with the targets yawed +-15 deg about the pulley axis (<target>_yaw{p15,m15})
  yaw12-m15: the -15 deg half of yaw12 (6 cells)
  fs6: 'single-stage free-space goals: twist, bend, bend_lift, stretch, wrist_tilt, random_mix (held-out frames, own start)'
  press48: 'press-down eval set: 12 snapshots x 4 Franka-only presses; not an MPC run'
  nom: nominal start data/lcs/start_states/pre_place_1_osc.npz, repeated (n_episodes = repeats)
  gv1: grasp-variant set1 (13 starts, data/lcs/start_states/grasp_variants/set1)
  gv1-2: set1 screen subset gv_00 + gv_05
  gv1-10: set1 tuning subset gv_00..gv_09
  gv1-d10: set1 controller-diagnosis subset gv_01..gv_10
  gv3: grasp-variant set3 (8 starts)
  stages10: 'the 10 matched starts of 2026-09-25: nominal + 8 of set1 + 1 of set3 (two-fixed-targets runs)'
  rec6: 'recorded replay set: nominal + 3 of set1 + 2 of set3'
  rec4: 'flat recorded set: nominal + 2 of set1 + 1 of set3'
  eeoff4: EE-offset starts data/lcs/start_states/ee_offsets (ee_f_x+8, ee_f_z+8, ee_ur_y-8, ee_f_rot5)
  long25: set1 gv_03, one 35 s episode
  cell-s30: one seat6 cell re-run with the stage-2 timeout 10 -> 30 s (episode cap 40 s)
  seat6-1goal30: seat6 starts, seated goal only (stage 1 shortened to 0.075 s), stage 2 30 s
  under12: 12 belt-under-pulley snapshots (data/lcs/contact/snapshots{,_heldout}/*final_under_osc.npz), seated goal only, 30 s
  seat6-rf: 'seat6 starts, the seed demo''s two goals (pre_place_2 4 s, seated 30 s), MPPI node, --belt-seg --cloud-noise real_like (V11)'
  seat6-rf11: 'seat6 starts, MPPI two stages on the latent (demo-spread tol, streak 3, 10 s / 30 s), clearance, belt-seg clean cloud'
  seat6-rf12: 'seat6 starts, MPPI on the latent, no prefix (V12 campaign cells: eval is always the full task), clearance, belt-seg clean cloud'
  hard11x2-rf: 'hard suite: 11 starts x 2 (run_hard_suite.SUITE resets), noise 0, MPPI on the latent, stage goals on waypoints, clearance, belt-seg clean cloud'
costs:
  Qw: whitened latent Q = w_q diag(1/z_std^2) (default)
  QA: metric A, learned global Q = L^T L
  QB: metric B, decoder pullback J^T W J at the goal
  Qi: isotropic Q = w_q I / sigma^2 (V10; z_std = sigma for every dim; two-block shape dims weighted by kappa); eval folders still named _Qw_
  Qw+wp: Qw + demo_traj.w_p 0.03 EE-path cost (rejected design)
  '-': waypoint baseline controller, no MPC cost
limits:
  ub-ins: u bounds from insertion data only (V2-era data; for V1x the v1 insertion data)
  ub-pool: u bounds pooled over the v3 union (V3a export bounds)
  ub-hand: V1b demo export with the 4 non-causal UR dims hand-set (_demo_ubnd.yaml)
  ub-hand-x0.5: ub-hand with u_bound_scale 0.5
  admmN: C3 admm_iter N when it is not the current default 2 (or in the E4 sweep)
