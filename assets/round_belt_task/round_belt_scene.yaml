# The round-belt task scene for Newton, as directives: a port of
# magna/models/round_belt_task/round-belt-scene.dmd.yaml.  Loaded by utils/directives (schema
# in docs/scene-directives.md) from round_belt_task/scene.py; round_belt_task/constants.py is a
# typed view over this file, so every scene number lives here, once, next to its provenance.
#
# World frame == the Drake world frame verbatim: origin at panda_link0, Z up, table top
# z = -0.02858, floor z = -0.81852 (the table visual's own AABB min z).  This is deliberately
# NOT round_belt.py's TABLE_TOP_Z = 0.72; do not "fix" it.
#
# ORDER IS LOAD-BEARING: it fixes every body and shape index.  The tabletop collider must sit
# between the table and the board (static shape range), and add_aloha_fingers must directly
# follow the gripper (its shapes count as gripper shapes).
#
# PyYAML is YAML 1.1: `8.95207485e01` and `2e4` parse as strings, which the loader coerces.
# Still write the signed form (8.95207485e+01, 2.0e+4): magna's dmd files do, so the two diff.
directives:
  # Table + Franka mount (visual only; Drake has no table collision).
  - add_model:
      name: table
      file: ../common/scene.urdf
      static: true
      color: [0.55, 0.35, 0.14]
  - add_weld: {parent: world, child: table::scene}   # no X_PC => identity
  - add_tabletop_collision:            # NOT in the Drake scene: safety floor under the belt
      # The Drake table is visual-only, so without this the belt drops through it before it
      # settles on the holder.  The box spans the table visual's footprint, top face at top_z.
      name: tabletop_collision
      table_visual: table/scene/visual0
      top_z: -0.02858                  # the Drake table-top height == the belt-holder weld z
      thickness: 0.04
      color: [0.55, 0.35, 0.14]
  # Task board: board mesh + collision box + the two fixed pulleys.
  #
  # Colours for parts whose assets author none of their own: the pulley OBJs carry no MTL data
  # and the board URDF paints every pulley sub-mesh one flat colour, so the small pulley and its
  # mounting plate came out identically white.  These follow round_belt.py:640-695, NOT
  # round_belt_task_board.sdf: that SDF paints every pulley half black (<diffuse>0 0 0 1</diffuse>)
  # and leaves the board -- which the mounting plate is part of -- light grey, i.e. the inverse
  # of the real hardware.  round_belt.py has it right: white pulley (small halves 0.80) on a
  # black mount (bracket/bearing/bolt 0.10, large pulley 0.10).
  - add_model:
      name: board                       # Drake: nist_board
      file: round_belt_task_board.urdf
      static: true
      color: [0.80, 0.80, 0.80]
      split_components: true
      component_colors:
        # The small pulley's mounting plate is not its own file here: it is baked into
        # round_belt_task_board.obj, one material spanning 18 disconnected solids.  The plate and
        # its four corner bolts sit at this board-local XY (where round_belt.py places its
        # separate bracket mesh); splitting the mesh lets just those parts go black.
        # max_span 0.2: the 384 x 384 mm panel -- never recolour it as if it were the plate.
        - {max_span: 0.2, near_local_xy: [0.3504, 0.1964], radius: 0.05, color: [0.10, 0.10, 0.10]}
      # Pins the round_belt.py colours above. They currently match the board URDF's own
      # materials; stated here so the SDF deviation lives in this file, not in an asset.
      link_colors:
        small_round_pulley: [0.80, 0.80, 0.80]
        large_round_pulley: [0.10, 0.10, 0.10]
  - add_weld:
      parent: world
      child: board::board
      X_PC:
        translation: [0.64483928, -0.19718233, 0.01076393]
        rotation: !Rpy { deg: [-3.32822058e-01, -6.87450103e-02, 8.95207485e+01] }
  - add_model:
      name: belt_chain_holder           # Drake: belt_holder
      file: ../common/belt_chain_holder/belt_chain_holder.urdf
      static: true
      color: [0.20, 0.60, 1.00]
  - add_weld:
      parent: world
      child: belt_chain_holder::belt_chain_holder_first_half
      X_PC:
        translation: [0.4736603358808432, 0.3520562100563749, -0.02858]
        rotation: !Rpy { deg: [0.0, 0.0, 90.0] }
  # Franka start pose == what the Drake round-belt SIM actually seeds, not the "ready" pose
  # from franka.dmd.yaml:
  #   magna/systems/parameters/round_belt_simulation_params.yaml:9-10
  #       q_init_franka      = [1.71717, 1.20002, -1.4548, -2.25837, 1.259265, 1.94719, 0.331838]
  #       q_init_franka_hand = [-0.004, 0.004]
  #   magna/systems/simulation/magna_simulation.cc:187-189 -- plant.SetPositions(...,
  #       franka_index, sim_params.q_init_franka) and the hand equivalent.
  # round-belt-scene.dmd.yaml adds panda_arm.urdf with NO default_joint_positions and never
  # loads franka.dmd.yaml, so that file's ready pose is not what this scene starts in.
  - add_model:
      name: panda_arm                   # Drake: panda
      file: ../common/franka/urdf/panda_arm.urdf
      default_joint_positions:
        panda_joint1: [1.71717]
        panda_joint2: [1.20002]
        panda_joint3: [-1.4548]
        panda_joint4: [-2.25837]
        panda_joint5: [1.259265]
        panda_joint6: [1.94719]
        panda_joint7: [0.331838]
      gravity_compensation: true
      importer_options: {enable_self_collisions: false, collapse_fixed_joints: false}
  - add_weld: {parent: world, child: panda_arm::panda_link0}   # no X_PC: this IS the world origin
  - add_model:
      name: panda_hand
      file: ../common/franka/urdf/panda_hand_with_long_fingers.urdf
      # q_init_franka_hand.  Asymmetric because panda_hand_with_long_fingers.urdf limits
      # panda_finger_joint1 to [-0.045, 0.0] and panda_finger_joint2 to [0.0, 0.045];
      # -0.004/+0.004 is a 4 mm-per-jaw opening inside both limits (no clamping needed).
      default_joint_positions: {panda_finger_joint1: [-0.004], panda_finger_joint2: [0.004]}
      gravity_compensation: true
      importer_options: {enable_self_collisions: false, collapse_fixed_joints: false}
  - add_weld:
      parent: panda_arm::panda_link8
      child: panda_hand::panda_hand
      X_PC: {translation: [0.0, 0.0, 0.0], rotation: !Rpy { deg: [0.0, 0.0, -45.0] }}
  - add_directives: {file: ../common/directives/ur10_2f85.yaml}
  # base_link is the URDF root, and the USD's root frame is identical to the URDF base_link
  # frame, so this Drake weld applies to the USD arm unchanged.
  - add_weld:
      parent: world
      child: ur10::base_link
      X_PC:
        translation: [1.33235648, -0.15491427, 0.03076191]
        rotation: !Rpy { deg: [-0.35720724, 0.72781324, 179.78723941] }
  # The belt: a closed VBD rod on the Drake round_belt.sdf ellipse.  round_belt.sdf pose
  # "x y 0  0 0 1.57079" applied to the X-major reference ellipse (major 0.248 along X, minor
  # 0.168 along Y): the +90 deg yaw turns the major axis onto world +Y, hence semi-axis
  # X = 0.168/2, semi-axis Y = 0.248/2.  Centre XY == the holder weld XY.
  # density / ke / kd / mu are omitted on purpose: they default to round_belt.py's computed
  # _estimate_belt_density() and CABLE_CONTACT_* (transcribing them would change the belt).
  - add_rod_ellipse:
      name: flexible_ellipse_cable
      center: [0.4736603358808432, 0.3520562100563749, 0.0]
      semi_axes: [0.084, 0.124]
      radius: 0.0033                    # round_belt.BELT_RADIUS, transcribed
      num_elements: 48                  # round_belt.BELT_NUM_ELEMENTS, transcribed
      color: [1.0, 0.5, 0.0]            # Drake's belt orange (round_belt.sdf: <diffuse>1.0 0.5 0.0 1</diffuse>)
      stretch_stiffness: 2.0e+4
      stretch_damping: 1.0e-1
      bend_stiffness: 1.5e-1
      bend_damping: 1.0e-1
  # Ground plane, level with the bottom of the table visual.
  - add_ground_plane: {name: ground, height_from_aabb_min_z_of: table/scene/visual0}
