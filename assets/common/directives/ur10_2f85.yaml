# UR10 + Robotiq 2F-85; port of magna ur.dmd.yaml (robotiq_85 -> robotiq_2f85 MJCF).
directives:
  # Textured NVIDIA USD; assets/common/ur10/ur10.urdf is only the FK reference.
  - add_model:
      name: ur10
      file: newton_asset://universal_robots_ur10/usd/ur10_instanceable.usda
      default_joint_positions:
        shoulder_pan_joint: [0.0]
        shoulder_lift_joint: [-1.57079632679]
        elbow_joint: [1.57079632679]
        wrist_1_joint: [-1.57079632679]
        wrist_2_joint: [-1.57079632679]
        wrist_3_joint: [0.0]
      gravity_compensation: true
      importer_options: {collapse_fixed_joints: false, enable_self_collisions: false, hide_collision_shapes: true}
  # The URDF wrist_3_link frame on the USD wrist_3_link (d6 = 0.0922, ur10.urdf:259).
  - add_frame:
      name: ur10_wrist_3_link_drake
      X_PF:
        base_frame: ur10::wrist_3_link
        translation: [0.0, 0.0922, 0.0]
        rotation: !Rpy { deg: [-90.0, 0.0, 0.0] }
  - add_model:
      name: robotiq_2f85
      file: ../../../2f85.xml
      gravity_compensation: true
      importer_options: {enable_self_collisions: false}
  - add_weld:
      parent: ur10_wrist_3_link_drake
      child: robotiq_2f85
      X_PC:
        # -3 mm: the UR flange boss seats in the GRP-CPL-062 coupling's 3 mm pocket, not flush.
        translation: [0.0, 0.0, -0.003]
        rotation: !Rpy { deg: [0.0, 0.0, 90.0] }
